name: Rust

# Runs for every pull request, when a release is published, or on demand.
on:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --offline --all-targets -- -D warnings
      - run: cargo test --locked --offline
      - run: cargo test --locked --offline --release
      - run: cargo doc --locked --offline --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo package --locked --offline

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # meshbox depends on nothing but the standard library (#7), on any target.
      - name: cargo tree lists meshbox alone
        shell: bash
        run: |
          tree="$(cargo tree --locked --offline --target all --all-features --edges normal,build,dev --prefix none --format '{p}')"
          echo "$tree"
          if [ "$(echo "$tree" | grep -c .)" -ne 1 ]; then
            echo "meshbox must have no dependencies" >&2
            exit 1
          fi

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - run: cargo test --locked --offline

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo build --locked --offline --lib --target wasm32-unknown-unknown

  # The golden hashes of meshes, glb files and previews hold under WebAssembly too.
  wasm-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - uses: taiki-e/install-action@v2
        with:
          tool: wasmtime
      - run: cargo test --locked --offline --target wasm32-wasip1 --test mesh --test gltf --test palette --test png --test voxel --test parse
        env:
          CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime
